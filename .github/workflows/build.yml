name: Cross-Platform Build

on:
  push:
    tags:
      - "v*.*"
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Release
        run: cargo build --release --locked

      - name: Rename binary for release (Windows)
        if: runner.os == 'Windows'
        run: mv target/release/sudoku.exe target/release/sudoku-windows.exe

      - name: Rename binary for release (Unix)
        if: runner.os != 'Windows'
        run: mv target/release/sudoku target/release/sudoku-${{ matrix.os }}

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: sudoku-${{ matrix.os }}
          path: target/release/sudoku-*

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: dist/*
